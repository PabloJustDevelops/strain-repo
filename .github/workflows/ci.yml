name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Raíz: app Expo (legado). Mientras exista es la app que se usa, así que su
  # red de seguridad no se toca. Se retira con el specs/004.
  # ---------------------------------------------------------------------------
  root:
    name: Raíz (Expo) · lint, tipos y pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (eslint + anti-slop)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # ---------------------------------------------------------------------------
  # Lynx: el producto. Tipos, pruebas y build de los dos targets.
  # ---------------------------------------------------------------------------
  lynx:
    name: Lynx · tipos, pruebas y build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lynx
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # La caché de descargas de bun (`~/.bun/install/cache`) evita volver a
      # bajar los paquetes. `bun install` sigue validando el lockfile.
      - name: Cache de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('lynx/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Test (vitest)
        run: bun run test

      - name: Build (targets lynx y web)
        run: bun run build

      # El presupuesto de bundle corre en un trabajo aparte que solo descarga
      # estos dos ficheros, para no repetir el build.
      - name: Subir bundles
        uses: actions/upload-artifact@v4
        with:
          name: lynx-bundles
          path: |
            lynx/dist/main.lynx.bundle
            lynx/dist/main.web.bundle
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Presupuesto de bundle: falla si los artefactos superan el umbral.
  #
  # UMBRALES: 650 kB nativo y 650 kB web (1 kB = 1000 bytes). Subirlos EXIGE una
  # decisión registrada en docs/07-decisions.md (hoy D16). No los ajustes aquí a
  # la ligera: el presupuesto solo sirve si crecer cuesta una decisión.
  # ---------------------------------------------------------------------------
  bundle-budget:
    name: Lynx · presupuesto de bundle
    needs: lynx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descargar bundles
        uses: actions/download-artifact@v4
        with:
          name: lynx-bundles
          path: lynx/dist

      - name: Comprobar tamaño
        run: node lynx/scripts/check-bundle-size.mjs
