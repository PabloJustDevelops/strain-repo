[versions]
# AGP 9.4: es la primera línea que admite API 37, y `androidx.core` 1.19.1 exige
# AGP >= 9.1 y compilar contra API 37. Requiere Gradle >= 9.6 (wrapper) y JDK 17.
agp = "9.4.1"
# Versiones del SDK nativo de Lynx, fijadas a las del motor 4.1.0 que usa Lynx Explorer.
lynx = "4.1.0"
primjs = "4.1.1"
coreKtx = "1.19.1"
# `xelement-svg` 4.1.0 arrastra `androidx.appcompat:appcompat:1.0.0`, que a su vez
# trae `vectordrawable` y `vectordrawable-animated` 1.0.0. Esos dos artefactos de
# 2018 declaran el MISMO namespace (`androidx.vectordrawable`) y AGP 9 rechaza el
# merge ("Namespace ... is used in multiple modules and/or libraries"). Se fijan
# las versiones modernas, que ya usan namespaces distintos entre sí.
vectordrawable = "1.2.0"
# AndroidX Test: solo para la prueba instrumentada del módulo de almacenamiento,
# que corre en un dispositivo/emulador con `connectedDebugAndroidTest`.
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
# Lynx 4.1.0 usa `androidx.core.util.Consumer` en runtime pero no lo declara en
# su POM: sin esto el host crashea con NoClassDefFoundError al construir el
# LynxView. Lo aporta el anfitrión.
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lynx = { group = "org.lynxsdk.lynx", name = "lynx", version.ref = "lynx" }
lynx-jssdk = { group = "org.lynxsdk.lynx", name = "lynx-jssdk", version.ref = "lynx" }
lynx-trace = { group = "org.lynxsdk.lynx", name = "lynx-trace", version.ref = "lynx" }
primjs = { group = "org.lynxsdk.lynx", name = "primjs", version.ref = "primjs" }
# Solo el XElement de `<svg>` (los iconos del bundle), no el paquete `xelement`
# completo, que arrastra webview/video/animax. El behavior se registra a mano.
xelement-svg = { group = "org.lynxsdk.lynx", name = "xelement-svg", version.ref = "lynx" }
# `xelement-svg` 4.1.0 depende de servalsvg 0.0.2, que no publica el .so para
# x86_64 (solo arm64/armv7/x86). Se sube a 0.2.4, que si lo trae, para poder
# correr en el emulador x86_64.
servalsvg = { group = "org.lynxsdk.lynx", name = "servalsvg", version = "0.2.4" }

# Sustituyen a las 1.0.0 que entran por `appcompat` 1.0.0 (transitiva de
# `xelement-svg`): mismo namespace en ambas 1.0.0, colisión que AGP 9 no admite.
vectordrawable = { group = "androidx.vectordrawable", name = "vectordrawable", version.ref = "vectordrawable" }
vectordrawable-animated = { group = "androidx.vectordrawable", name = "vectordrawable-animated", version.ref = "vectordrawable" }

# Prueba instrumentada: `ApplicationProvider` (core), el runner y JUnit4.
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
# Ya no se declara `org.jetbrains.kotlin.android`: AGP 9 trae Kotlin integrado
# (`builtInKotlin`) y aplicar el plugin externo es un error de configuración.
# El KGP lo aporta el propio AGP (2.2.10 como mínimo).
android-application = { id = "com.android.application", version.ref = "agp" }
