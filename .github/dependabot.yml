# Dependabot (specs/005, ticket 4).
#
# Ecosistemas que existen de verdad en el repo:
#   - bun: el proyecto (la raíz).
#   - gradle: el host Android (`host/android`).
#   - github-actions: las acciones de `.github/workflows/`.
#
# Los cambios menores y de parche se agrupan en una sola propuesta por
# ecosistema; los mayores van sueltos porque exigen lectura. Horario semanal:
# las dependencias nativas y de Lynx se mueven rápido, pero no tanto como para
# justificar ruido diario.
version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-y-parche:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # `typescript` >= 7 no se puede subir todavía (issue #69): la 7 es el
    # compilador nativo y no publica la API del compilador, que es la que importa
    # rspeedy en su hook de registro. Quitar este ignore cuando una versión de
    # rspeedy acepte la 7 (que su peer `typescript` incluya `7.x`).
    ignore:
      - dependency-name: typescript
        versions: [">= 7.0.0"]

  - package-ecosystem: gradle
    directory: "/host/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      host-android-minor-y-parche:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
