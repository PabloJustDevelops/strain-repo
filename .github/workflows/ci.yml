name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Proyecto: tipos, pruebas y build de los dos targets.
  # ---------------------------------------------------------------------------
  project:
    name: Tipos, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # La caché de descargas de bun (`~/.bun/install/cache`) evita volver a
      # bajar los paquetes. `bun install` sigue validando el lockfile.
      - name: Cache de bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Test (vitest)
        run: bun run test

      - name: Build (targets lynx y web)
        run: bun run build

      # El presupuesto de bundle corre en un trabajo aparte que solo descarga
      # estos dos ficheros, para no repetir el build.
      - name: Subir bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            dist/main.lynx.bundle
            dist/main.web.bundle
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Presupuesto de bundle: falla si los artefactos superan el umbral.
  #
  # UMBRALES: 650 kB nativo y 650 kB web (1 kB = 1000 bytes). Subirlos EXIGE una
  # decisión registrada en docs/07-decisions.md (hoy D16). No los ajustes aquí a
  # la ligera: el presupuesto solo sirve si crecer cuesta una decisión.
  # ---------------------------------------------------------------------------
  bundle-budget:
    name: Presupuesto de bundle
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Descargar bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist

      - name: Comprobar tamaño
        run: node scripts/check-bundle-size.mjs

  # ---------------------------------------------------------------------------
  # Host Android: compila el APK de debug con Gradle.
  #
  # Es el único trabajo que toca JDK y SDK de Android, y el que convierte un
  # cambio de AGP, de Gradle o del wrapper en un fallo real en vez de un check
  # verde que no comprueba nada: `project` sólo instala Bun y ejecuta
  # typecheck/pruebas/build de los bundles, así que un salto de toolchain pasaba
  # en verde (issue #61). Este trabajo mide; migrar el host es otro trabajo.
  # ---------------------------------------------------------------------------
  android:
    name: Host Android · assembleDebug
    # Descarga el artefacto `bundles` que produce `project` (ver más abajo).
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # JDK 17 fijado explícito: el host declara sourceCompatibility 17 y no
      # queremos que el resultado dependa del JDK por defecto del runner.
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # El paquete de plataforma se llama `platforms;android-37.0` (API 37 con
      # versión menor: no existe un `platforms;android-37` a secas) y
      # `build-tools;36.0.0` es el que AGP 9.4 usa por defecto. Instalar lo que
      # el host necesita: si el host sube de compileSdk, este job falla y avisa.
      #
      # `packages` va en UNA línea separada por espacios: la acción hace
      # `getInput('packages').split(' ')`, así que un bloque multilínea llega
      # como un único argumento y sdkmanager no encuentra el paquete.
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      # Caché del Gradle User Home: dependencias Y distribuciones del wrapper
      # (~/.gradle/wrapper/dists, ~100 MB por run). Sin esto, cada PR vuelve a
      # bajar Gradle entero. La caché solo se escribe en main; el resto lee.
      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v6

      # El bundle lo produce `bun run build` en la raíz y lo copia una tarea de
      # Gradle (`copyLynxBundle`) desde `dist/`. Lo descargamos del artefacto de
      # `project` en vez de repetir el build: misma intención que `bundle-budget`.
      - name: Descargar bundle
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist

      # El wrapper está en 100755 en git, así que `./gradlew` es ejecutable.
      - name: Compilar host (assembleDebug)
        working-directory: host/android
        run: ./gradlew assembleDebug

  # ---------------------------------------------------------------------------
  # Seguridad: escaneo de secretos. El fallo más caro y más fácil de cometer.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Seguridad · escaneo de secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # gitleaks lee los commits de la propuesta a través de la API: necesita
    # `pull-requests: read` además del contenido.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Historial completo: gitleaks necesita el rango del cambio para
      # compararlo con la base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Versión fijada: la sintaxis de `.gitleaks.toml` ([allowlists]) cambia
          # entre mayores, y un salto silencioso no debe alterar lo que se detecta.
          GITLEAKS_VERSION: "8.30.1"

  # ---------------------------------------------------------------------------
  # Propuesta de cambio: título con Conventional Commits y etiquetas de triaje.
  #
  # Fase 1: AVISA, no bloquea. El repo todavía no tiene reglas de protección de
  # rama; por eso el script termina en verde y deja los avisos como anotaciones.
  # Ver docs/agents/triage-labels.md.
  # ---------------------------------------------------------------------------
  pr:
    name: PR · título y triaje
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar título y etiquetas
        run: node .github/scripts/check-pr.mjs
